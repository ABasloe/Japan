name: 🌤️ Refresh Spain Weather & Deploy

# Refreshes the live Open-Meteo forecast baked into spain.html every hour.
# (The Iceland auto-refresh is paused: that trip — March 6–10, 2026 — is in the
#  past, so Open-Meteo returns no forecast for it and the run always failed.)

on:
  schedule:
    - cron: '0 * * * *'   # Every hour on the hour (UTC)
  workflow_dispatch:       # Also allow manual trigger from GitHub UI

permissions:
  contents: write          # Needed to push the updated spain.html back

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install folium polyline requests

      - name: Delete weather cache (force fresh fetch)
        run: rm -f spain_weather_cache.json

      - name: Regenerate Spain map with fresh weather
        run: python3 spain_interactive_map.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spain.html spain_weather_cache.json spain_route_cache.json
          git diff --staged --quiet || git commit -m "🌤️ Auto-refresh Spain weather [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
